# 自动打包 macOS universal + Windows 安装包
#
# 触发方式：
#   - push 到 main 分支：构建并上传安装包（Actions 页面可下载）
#   - 推送 v* 标签（如 git tag v1.0.0 && git push origin v1.0.0）：额外发布 GitHub Release
#   - 手动触发：仓库 Actions 页面点 "Run workflow"
#
# 代码签名（可选，未配置时产物为未签名状态，安装时会有系统提示）：
#   在仓库 Settings → Secrets and variables → Actions 配置以下 secrets：
#   - macOS 公证（需要 Apple Developer 账号）：
#       CSC_LINK（.p12 证书 base64）、CSC_KEY_PASSWORD、APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID
#   - Windows 签名：
#       WIN_CSC_LINK（.pfx 证书 base64）、WIN_CSC_KEY_PASSWORD
#   配置后自动生效，无需修改本文件。

name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac --universal
            artifact: mac-universal
          - os: windows-latest
            args: --win
            artifact: win-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 只在 secrets 已配置时注入签名环境变量。
      # 注意：不能用 `CSC_LINK: ${{ secrets.CSC_LINK }}` 这种写法——
      # 未配置的 secret 会被 GitHub 展开为空字符串，electron-builder 会把空串
      # 当作证书路径导致 "not a file" 报错。
      - name: Configure code signing (if secrets are set)
        shell: bash
        run: |
          if [[ -n "${{ secrets.CSC_LINK }}" ]]; then
            printf 'CSC_LINK=%s\n' "${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            printf 'APPLE_ID=%s\n' "${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi
          if [[ -n "${{ secrets.WIN_CSC_LINK }}" ]]; then
            printf 'WIN_CSC_LINK=%s\n' "${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
            printf 'WIN_CSC_KEY_PASSWORD=%s\n' "${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # 无证书时禁止自动发现签名身份（macOS keychain / Windows 证书库）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      # 只有推送 v* 标签时才创建 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
