<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneTouchStart</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1f2329;
    }
    .card {
      text-align: center;
      padding: 40px 56px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 4px 0; color: #646a73; }
    code { background: #f0f1f3; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OneTouchStart</h1>
    <p>用于一键启动服务的程序</p>
    <p id="versions">加载中…</p>
  </div>
  <script>
    const { versions } = window.appInfo;
    document.getElementById('versions').innerHTML =
      `Electron <code>${versions.electron}</code> · Chromium <code>${versions.chrome}</code> · Node <code>${versions.node}</code>`;
  </script>
</body>
</html>
